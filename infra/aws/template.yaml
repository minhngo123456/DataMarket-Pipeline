AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Group 07 MarketData pipeline: private tenant data, queued workers and JWT API; CloudFront
  is optional.'
Parameters:
  WebOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact browser origin; update when frontend is deployed.
  LocalDevOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Second allowed browser origin for local development. Set it equal to WebOrigin to allow only one origin.
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues:
    - DISABLED
    - ENABLED
  EnableCloudFront:
    Type: String
    Default: DISABLED
    AllowedValues:
    - DISABLED
    - ENABLED
    Description: Create CloudFront only when the AWS account is eligible; otherwise use an external/local
      web origin.
  AnthropicSecretArn:
    Type: String
    Default: ''
    AllowedPattern: ^$|^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$
    Description: Existing same-account/Region Secrets Manager secret with JSON api_key; empty disables
      live AI.
  AlarmEmail:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[^\s@]+@[^\s@]+\.[^\s@]+$
    Description: Optional operations email. Confirm the SNS subscription before testing alarms.
Conditions:
  UseCloudFront:
    Fn::Equals:
    - Ref: EnableCloudFront
    - ENABLED
  SingleWebOrigin:
    Fn::Equals:
    - Ref: WebOrigin
    - Ref: LocalDevOrigin
  HasAnthropicSecret:
    Fn::Not:
    - Fn::Equals:
      - Ref: AnthropicSecretArn
      - ''
  HasAlarmEmail:
    Fn::Not:
    - Fn::Equals:
      - Ref: AlarmEmail
      - ''
Globals:
  Function:
    Runtime: python3.12
    Architectures:
    - x86_64
    Timeout: 45
    MemorySize: 256
Resources:
  ControlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  ObservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      - AttributeName: gsi1pk
        AttributeType: S
      - AttributeName: gsi1sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      GlobalSecondaryIndexes:
      - IndexName: by_day
        Projection:
          ProjectionType: ALL
        KeySchema:
        - AttributeName: gsi1pk
          KeyType: HASH
        - AttributeName: gsi1sk
          KeyType: RANGE
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
        - Id: retention
          Status: Enabled
          ExpirationInDays: 30
          NoncurrentVersionExpiration:
            NoncurrentDays: 7
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - content-type
          AllowedMethods:
          - PUT
          AllowedOrigins:
            Fn::If:
            - SingleWebOrigin
            - - Ref: WebOrigin
            - - Ref: WebOrigin
              - Ref: LocalDevOrigin
          MaxAge: 300
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
        - Id: retention
          Status: Enabled
          ExpirationInDays: 30
          NoncurrentVersionExpiration:
            NoncurrentDays: 7
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 1
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  CSVQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  CSVQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - CSVQueueDLQ
          - Arn
        maxReceiveCount: 5
  APIQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  APIQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - APIQueueDLQ
          - Arn
        maxReceiveCount: 5
  WebQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  WebQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - WebQueueDLQ
          - Arn
        maxReceiveCount: 5
  TransformQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  TransformQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - TransformQueueDLQ
          - Arn
        maxReceiveCount: 5
  ReportQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  ReportQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 720
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - ReportQueueDLQ
          - Arn
        maxReceiveCount: 5
    Metadata:
      com.aws.cloudformation.Context:
        why: Report handler can wait for external AI; queue visibility covers six full handler timeouts.
        must:
        - VisibilityTimeout >= 6 * ReportAggregator.Timeout; partial failures remain retryable.
  DispatchDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  CSVObjectCreated:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
        - aws.s3
        detail-type:
        - Object Created
        detail:
          bucket:
            name:
            - Ref: RawBucket
          reason:
          - PutObject
          object:
            key:
            - prefix: tenants/
      Targets:
      - Arn:
          Fn::GetAtt:
          - CSVQueue
          - Arn
        Id: CSVQueue
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - DispatchDLQ
            - Arn
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600
  CSVQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: CSVQueue
      - Ref: DispatchDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
          - Fn::GetAtt:
            - CSVQueue
            - Arn
          - Fn::GetAtt:
            - DispatchDLQ
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - CSVObjectCreated
                - Arn
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
  Normalizer:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda/
      Handler: services.normalizer.app.handler
      Environment:
        Variables:
          CONTROL_TABLE: &id001
            Ref: ControlTable
          OBSERVATIONS_TABLE: &id002
            Ref: ObservationsTable
      Events:
        TransformMessages:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - TransformQueue
              - Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
            - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2
      Role:
        Fn::GetAtt:
        - NormalizerExecutionRole
        - Arn
  CSVWorker:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda/
      Handler: services.ingestion.csv_worker.handler
      Environment:
        Variables:
          CONTROL_TABLE: *id001
          OBSERVATIONS_TABLE: *id002
          RAW_BUCKET:
            Ref: RawBucket
          TRANSFORM_QUEUE_URL:
            Ref: TransformQueue
      Events:
        CSVUploads:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - CSVQueue
              - Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
            - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2
      Role:
        Fn::GetAtt:
        - CSVWorkerExecutionRole
        - Arn
  APIWorker:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda/
      Handler: services.ingestion.api_worker.handler
      Environment:
        Variables:
          CONTROL_TABLE: *id001
          OBSERVATIONS_TABLE: *id002
          TRANSFORM_QUEUE_URL:
            Ref: TransformQueue
          API_QUEUE_URL:
            Ref: APIQueue
          SOURCE_SNAPSHOT_BUCKET:
            Ref: RawBucket
      Events:
        APIJobs:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - APIQueue
              - Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
            - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2
      Role:
        Fn::GetAtt:
        - APIWorkerExecutionRole
        - Arn
  WebWorker:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda/
      Handler: services.ingestion.web_worker.handler
      Environment:
        Variables:
          CONTROL_TABLE: *id001
          OBSERVATIONS_TABLE: *id002
          TRANSFORM_QUEUE_URL:
            Ref: TransformQueue
          WEB_QUEUE_URL:
            Ref: WebQueue
          SOURCE_SNAPSHOT_BUCKET:
            Ref: RawBucket
      Events:
        WebJobs:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - WebQueue
              - Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
            - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2
      Role:
        Fn::GetAtt:
        - WebWorkerExecutionRole
        - Arn
  SchedulerGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties: {}
  JobDispatcher:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda/
      Handler: services.ingestion.dispatcher.handler
      Environment:
        Variables:
          CONTROL_TABLE: *id001
          OBSERVATIONS_TABLE: *id002
          DISPATCH_MODE: sources
          API_QUEUE_URL:
            Ref: APIQueue
          WEB_QUEUE_URL:
            Ref: WebQueue
          REPORT_QUEUE_URL:
            Ref: ReportQueue
      Policies:
      - Statement:
        - &id003
          Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:Query
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          Resource:
            Fn::GetAtt:
            - ControlTable
            - Arn
        - Effect: Allow
          Action:
          - dynamodb:Scan
          Resource:
            Fn::GetAtt:
            - ControlTable
            - Arn
        - Effect: Allow
          Action:
          - sqs:SendMessage
          Resource:
          - Fn::GetAtt:
            - APIQueue
            - Arn
          - Fn::GetAtt:
            - WebQueue
            - Arn
  JobDispatcherScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - SchedulerGroup
                - Arn
      Policies:
      - PolicyName: InvokeDispatcher
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
              Fn::GetAtt:
              - JobDispatcher
              - Arn
          - Effect: Allow
            Action:
            - sqs:SendMessage
            Resource:
              Fn::GetAtt:
              - DispatchDLQ
              - Arn
  JobDispatcherSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName:
        Ref: SchedulerGroup
      ScheduleExpression: rate(6 hours)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State:
        Ref: ScheduleState
      Target:
        Arn:
          Fn::GetAtt:
          - JobDispatcher
          - Arn
        RoleArn:
          Fn::GetAtt:
          - JobDispatcherScheduleRole
          - Arn
        Input: '{"mode":"sources","scheduled_at":"<aws.scheduler.scheduled-time>"}'
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - DispatchDLQ
            - Arn
  ReportDispatcher:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda/
      Handler: services.ingestion.dispatcher.handler
      Environment:
        Variables:
          CONTROL_TABLE: *id001
          OBSERVATIONS_TABLE: *id002
          DISPATCH_MODE: reports
          API_QUEUE_URL:
            Ref: APIQueue
          WEB_QUEUE_URL:
            Ref: WebQueue
          REPORT_QUEUE_URL:
            Ref: ReportQueue
      Policies:
      - Statement:
        - *id003
        - Effect: Allow
          Action:
          - dynamodb:Scan
          Resource:
            Fn::GetAtt:
            - ControlTable
            - Arn
        - Effect: Allow
          Action:
          - sqs:SendMessage
          Resource:
          - Fn::GetAtt:
            - ReportQueue
            - Arn
  ReportDispatcherScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - SchedulerGroup
                - Arn
      Policies:
      - PolicyName: InvokeDispatcher
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
              Fn::GetAtt:
              - ReportDispatcher
              - Arn
          - Effect: Allow
            Action:
            - sqs:SendMessage
            Resource:
              Fn::GetAtt:
              - DispatchDLQ
              - Arn
  ReportDispatcherSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName:
        Ref: SchedulerGroup
      ScheduleExpression: cron(0 8 * * ? *)
      ScheduleExpressionTimezone: Asia/Ho_Chi_Minh
      FlexibleTimeWindow:
        Mode: 'OFF'
      State:
        Ref: ScheduleState
      Target:
        Arn:
          Fn::GetAtt:
          - ReportDispatcher
          - Arn
        RoleArn:
          Fn::GetAtt:
          - ReportDispatcherScheduleRole
          - Arn
        Input: '{"mode":"reports","scheduled_at":"<aws.scheduler.scheduled-time>"}'
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - DispatchDLQ
            - Arn
  NormalizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${Normalizer}
      RetentionInDays: 7
  CSVWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${CSVWorker}
      RetentionInDays: 7
  APIWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${APIWorker}
      RetentionInDays: 7
  WebWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${WebWorker}
      RetentionInDays: 7
  JobDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${JobDispatcher}
      RetentionInDays: 7
  ReportDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ReportDispatcher}
      RetentionInDays: 7
  NotificationFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Async notification failures do not reach the report queue.
        must:
        - Send operations alerts to AlarmTopic, not a tenant report topic.
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: NotificationFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-NotificationFunctionErrorsAlarm
      AlarmActions:
      - Ref: AlarmTopic
      OKActions:
      - Ref: AlarmTopic
  CSVQueueDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - CSVQueueDLQ
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-CSVQueueDLQAlarm
      AlarmActions:
      - Ref: AlarmTopic
      OKActions:
      - Ref: AlarmTopic
  APIQueueDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - APIQueueDLQ
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-APIQueueDLQAlarm
      AlarmActions:
      - Ref: AlarmTopic
      OKActions:
      - Ref: AlarmTopic
  WebQueueDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - WebQueueDLQ
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-WebQueueDLQAlarm
      AlarmActions:
      - Ref: AlarmTopic
      OKActions:
      - Ref: AlarmTopic
  TransformQueueDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - TransformQueueDLQ
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-TransformQueueDLQAlarm
      AlarmActions:
      - Ref: AlarmTopic
      OKActions:
      - Ref: AlarmTopic
  ReportQueueDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - ReportQueueDLQ
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-ReportQueueDLQAlarm
      AlarmActions:
      - Ref: AlarmTopic
      OKActions:
      - Ref: AlarmTopic
  DispatchDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - DispatchDLQ
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmName:
        Fn::Sub: ${AWS::StackName}-DispatchDLQAlarm
      AlarmActions:
      - Ref: AlarmTopic
      OKActions:
      - Ref: AlarmTopic
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-http-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          Fn::If:
          - SingleWebOrigin
          - - Ref: WebOrigin
          - - Ref: WebOrigin
            - Ref: LocalDevOrigin
        AllowMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
        AllowHeaders:
        - authorization
        - content-type
        MaxAge: 300
  HttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: HttpApi
      StageName: $default
      AutoDeploy: true
  JWTAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId:
        Ref: HttpApi
      AuthorizerType: JWT
      Name: CognitoJWT
      IdentitySource:
      - $request.header.Authorization
      JwtConfiguration:
        Audience:
        - Ref: UserPoolClient
        Issuer:
          Fn::Sub: https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda/
      Handler: services.api.app.handler
      Environment:
        Variables:
          CONTROL_TABLE: *id001
          OBSERVATIONS_TABLE: *id002
          RAW_BUCKET:
            Ref: RawBucket
          REPORTS_BUCKET:
            Ref: ReportsBucket
          REPORT_QUEUE_URL:
            Ref: ReportQueue
          USER_POOL_ID:
            Ref: UserPool
      Policies:
      - Ref: ApiDataPolicy
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminCreateUser
          - cognito-idp:AdminGetUser
          Resource:
            Fn::GetAtt:
            - UserPool
            - Arn
        - Effect: Allow
          Action:
          - dynamodb:DeleteItem
          Resource:
            Fn::GetAtt:
            - ControlTable
            - Arn
        - Effect: Allow
          Action:
          - sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - ReportQueue
            - Arn
  ReportAggregator:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../build/lambda/
      Handler: services.reporting.aggregator.handler
      Timeout: 120
      Environment:
        Variables:
          CONTROL_TABLE: *id001
          OBSERVATIONS_TABLE: *id002
          REPORTS_BUCKET:
            Ref: ReportsBucket
          ANTHROPIC_SECRET_ARN:
            Ref: AnthropicSecretArn
          NOTIFICATION_FUNCTION_NAME:
            Ref: NotificationFunction
      Events:
        ReportMessages:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - ReportQueue
              - Arn
            BatchSize: 1
            FunctionResponseTypes:
            - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 2
      Role:
        Fn::GetAtt:
        - ReportAggregatorExecutionRole
        - Arn
    Metadata:
      com.aws.cloudformation.Context:
        why: Saves a report before invoking the notification function asynchronously.
        must:
        - Resolve credentials at runtime; never put API keys in template parameters or logs.
        - Invoke only this stack's NotificationFunction; delivery credentials belong to that function.
  ReportAggregatorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ReportAggregatorDataAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - *id003
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:Query
            Resource:
            - Fn::GetAtt:
              - ObservationsTable
              - Arn
            - Fn::Sub: ${ObservationsTable.Arn}/index/by_day
          - Effect: Allow
            Action:
            - s3:PutObject
            Resource:
              Fn::Sub: ${ReportsBucket.Arn}/tenants/*/reports/*
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - ReportQueue
              - Arn
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
              Fn::GetAtt:
              - NotificationFunction
              - Arn
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
  ReportAggregatorSecretPolicy:
    Type: AWS::IAM::RolePolicy
    Condition: HasAnthropicSecret
    Metadata:
      com.aws.cloudformation.Context:
        why: Read only the Claude secret selected by the deployment parameter.
        must:
        - Use the complete ARN of a secret in this account and Region.
    Properties:
      RoleName:
        Ref: ReportAggregatorExecutionRole
      PolicyName: ReportAggregatorReadAnthropicSecret
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Ref: AnthropicSecretArn
          Condition:
            StringEquals:
              aws:ResourceAccount:
                Ref: AWS::AccountId
  ReportAggregatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ReportAggregator}
      RetentionInDays: 7
  NotificationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Sends tenant reports independently of report generation and retries failed channels.
        must:
        - Validate destination account, Region and tenant namespace before sending.
        - Keep report destinations separate from operations alarms.
    Properties:
      CodeUri: ../../build/lambda/
      Handler: services.reporting.notification.handler
      Timeout: 30
      Environment:
        Variables:
          CONTROL_TABLE: *id001
          OBSERVATIONS_TABLE: *id002
          NOTIFICATION_STACK_NAME:
            Ref: AWS::StackName
          AWS_ACCOUNT_ID:
            Ref: AWS::AccountId
      Policies:
      - Statement:
        - *id003
        - Effect: Allow
          Action:
          - sns:Publish
          Resource:
            Fn::Sub: arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-tenant-*
        - Effect: Allow
          Action:
          - secretsmanager:GetSecretValue
          Resource:
            Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/tenants/*/slack-*
        - Effect: Allow
          Action:
          - kms:GenerateDataKey
          - kms:Decrypt
          Resource:
            Fn::GetAtt:
            - NotificationKey
            - Arn
          Condition:
            StringEquals:
              kms:ViaService:
                Fn::Sub: sns.${AWS::Region}.${AWS::URLSuffix}
  NotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${NotificationFunction}
      RetentionInDays: 7
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ApiFunction}
      RetentionInDays: 7
