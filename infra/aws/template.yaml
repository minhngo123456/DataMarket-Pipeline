            - Arn
          - Fn::Sub: ${ReportsBucket.Arn}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
  ApiDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Attach to Hieu API role after JWT, membership and RBAC checks are implemented.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:Query
          Resource:
          - Fn::GetAtt:
            - ControlTable
            - Arn
          - Fn::GetAtt:
            - ObservationsTable
            - Arn
          - Fn::Sub: ${ObservationsTable.Arn}/index/by_day
        - Effect: Allow
          Action:
          - s3:PutObject
          Resource:
            Fn::Sub: ${RawBucket.Arn}/tenants/*/raw/*
        - Effect: Allow
          Action:
          - s3:GetObject
          Resource:
            Fn::Sub: ${ReportsBucket.Arn}/tenants/*
        - Effect: Allow
          Action:
          - dynamodb:ConditionCheckItem
          Resource:
            Fn::GetAtt:
            - ControlTable
            - Arn
    Metadata:
      com.aws.cloudformation.Context:
        why: API transactions may condition-check the active tenant before updating membership.
        must:
        - Identity, role and tenant checks remain in the API; IAM table scope is not row isolation.
  NormalizerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: NormalizerDataAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - *id003
          - Effect: Allow
            Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            Resource:
              Fn::GetAtt:
              - ObservationsTable
              - Arn
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - TransformQueue
              - Arn
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
