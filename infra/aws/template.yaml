  ReportsBucket:
    Value:
      Ref: ReportsBucket
  WebBucket:
    Value:
      Ref: WebBucket
  CSVQueueUrl:
    Value:
      Ref: CSVQueue
  CSVQueueArn:
    Value:
      Fn::GetAtt:
      - CSVQueue
      - Arn
  APIQueueUrl:
    Value:
