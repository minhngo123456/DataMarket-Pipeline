name: Python checks
on:
  push:
    paths: ['marketdata/**', 'services/**', 'tests/**', 'infra/**', '*.txt', 'pyproject.toml', '.github/workflows/python.yml']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock.txt
      - run: ruff check .
      - run: pytest -q
      - run: cfn-lint infra/aws/template.yaml
      - run: python -m scripts.validate_template
      - run: cfn-lint build/cloudformation.json
